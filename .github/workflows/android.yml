name: Android APK Build

# 触发条件：push 到 main/master、打 tag v*、手动 workflow_dispatch
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            libltdl-dev libncurses-dev \
            unzip zip ccache git wget ca-certificates \
            build-essential openjdk-17-jdk

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache project build
        uses: actions/cache@v4
        with:
          path: |
            android/.buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          # 已知的 license hash（覆盖 build-tools 31-37 等版本）
          printf "\n8933bad161af4178b11829d476d49d6d4d8b2c62\n24333f8a63b6825ea9c5514f83c28289b004d1fee\nd56f6127a7c0faae84f60ceab4d5e8a6\n" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          printf "\nd975f751698a5dc0cb2c6a63260843b6\n" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license
          printf "\n0afb6751e1f8b00a434c2e04c5d5ca16\n" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
          printf "\n33b6a2b6c077a910e60d35e6cefd3df6\n" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license
          ls -la $HOME/.buildozer/android/platform/android-sdk/licenses/

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          # 接受 runner 自带 SDK 的所有 licenses（兜底）
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          buildozer android debug
          # 打包 release 需要签名密钥，默认只打 debug
          # 如需 release，配置 ANDROID_KEYSTORE_* 环境变量后运行 buildozer android release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-debug-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/bin/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
