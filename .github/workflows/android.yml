name: Android APK Build

# 触发条件：push 到 main/master、打 tag v*、手动 workflow_dispatch
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            libltdl-dev libncurses-dev \
            unzip zip ccache git wget ca-certificates \
            build-essential openjdk-17-jdk

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache project build
        uses: actions/cache@v4
        with:
          path: |
            android/.buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Setup Android SDK for buildozer
        run: |
          BUILD_SDK=$HOME/.buildozer/android/platform/android-sdk
          RUNNER_SDK=/usr/local/lib/android/sdk
          mkdir -p $BUILD_SDK
          # 把 runner 自带 SDK 的子目录符号链接到 buildozer 期望位置
          for d in cmdline-tools platform-tools build-tools platforms ndk-bundle; do
            if [ -d "$RUNNER_SDK/$d" ]; then
              ln -sfn "$RUNNER_SDK/$d" "$BUILD_SDK/$d"
            fi
          done
          # buildozer 旧逻辑期望 sdkmanager 在 tools/bin/sdkmanager（已废弃布局）
          # 创建 tools/bin/ 目录并把 sdkmanager 链接过去
          mkdir -p $BUILD_SDK/tools/bin
          ln -sfn "$RUNNER_SDK/cmdline-tools/latest/bin/sdkmanager" "$BUILD_SDK/tools/bin/sdkmanager"
          ln -sfn "$RUNNER_SDK/cmdline-tools/latest/bin/avdmanager" "$BUILD_SDK/tools/bin/avdmanager" 2>/dev/null || true
          # 预写入已知 license hash（覆盖 build-tools 31-37 等版本）
          mkdir -p $BUILD_SDK/licenses
          printf "\n8933bad161af4178b11829d476d49d6d4d8b2c62\n24333f8a63b6825ea9c5514f83c28289b004d1fee\nd56f6127a7c0faae84f60ceab4d5e8a6\n" > $BUILD_SDK/licenses/android-sdk-license
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > $BUILD_SDK/licenses/android-sdk-preview-license
          printf "\nd975f751698a5dc0cb2c6a63260843b6\n" > $BUILD_SDK/licenses/android-sdk-arm-dbt-license
          printf "\n0afb6751e1f8b00a434c2e04c5d5ca16\n" > $BUILD_SDK/licenses/android-googletv-license
          printf "\n33b6a2b6c077a910e60d35e6cefd3df6\n" > $BUILD_SDK/licenses/android-sdk-arm-dbt-license
          # 接受 runner SDK 所有 licenses（兜底）
          yes | $RUNNER_SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # 验证旧路径 sdkmanager 可达
          ls -la $BUILD_SDK/tools/bin/sdkmanager
          echo "OK: sdkmanager ready at old-path tools/bin/sdkmanager"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          buildozer android debug
          # 打包 release 需要签名密钥，默认只打 debug
          # 如需 release，配置 ANDROID_KEYSTORE_* 环境变量后运行 buildozer android release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-debug-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/bin/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
